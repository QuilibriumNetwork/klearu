[package]
name = "klearu-tauri"
description = "Klearu desktop app (Tauri 2.x shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "klearu_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "klearu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
klearu-desktop = { workspace = true }
tauri = { workspace = true }
# Plugin crates must be visible deps of the binary so tauri-build's permission
# resolver finds their manifests. The actual `.plugin(init())` calls live in
# klearu-desktop.
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
